# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: secdevlabs-tictactoe
services:
  mysqldb:
    build:
      context: ../../build/mysqldb
      labels:
        isoloom.managed: 'true'
        isoloom.environment: secdevlabs-tictactoe
    image: isoloom/secdevlabs-tictactoe-mysqldb
    platform: linux/amd64
    hostname: mysqldb
    networks:
      lab:
        ipv4_address: 10.60.92.20
    volumes:
    - mysqldb-data:/var/lib/mysql
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3306
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.mariadb: tcp:3306
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-tictactoe
    restart: unless-stopped
  mysqldb-routes:
    image: alpine:3.20
    network_mode: service:mysqldb
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      mysqldb:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-tictactoe
  web:
    build:
      context: ../../build/web
      labels:
        isoloom.managed: 'true'
        isoloom.environment: secdevlabs-tictactoe
    image: isoloom/secdevlabs-tictactoe-web
    platform: linux/amd64
    hostname: web
    networks:
      lab:
        ipv4_address: 10.60.92.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+10005}:10005
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 10005
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      mysqldb:
        condition: service_healthy
      mysqldb-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:10005
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-tictactoe
    restart: unless-stopped
  web-routes:
    image: alpine:3.20
    network_mode: service:web
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-tictactoe
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    user: '0'
    cap_add:
    - NET_ADMIN
    depends_on:
      mysqldb:
        condition: service_healthy
      mysqldb-routes:
        condition: service_healthy
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-tictactoe
  isoloom-check-mysqldb:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/mysqldb.sh:/isoloom/run.sh:ro
    network_mode: service:mysqldb
    depends_on:
      mysqldb:
        condition: service_healthy
      mysqldb-routes:
        condition: service_healthy
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-tictactoe
  isoloom-check-web:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/web.sh:/isoloom/run.sh:ro
    network_mode: service:web
    depends_on:
      mysqldb:
        condition: service_healthy
      mysqldb-routes:
        condition: service_healthy
      web:
        condition: service_healthy
      web-routes:
        condition: service_healthy
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-tictactoe
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-tictactoe
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.92.0/24
        gateway: 10.60.92.1
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-tictactoe
volumes:
  mysqldb-data:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-tictactoe
  isoloom-probe-amd64:
    labels:
      isoloom.managed: 'true'
      isoloom.environment: secdevlabs-tictactoe
