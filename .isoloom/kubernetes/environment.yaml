        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      - name: wait-mysqldb
        image: alpine:3.20
        command:
        - sh
        - -c
        - until nc -z mysqldb 3306; do sleep 2; done
      containers:
      - name: web
        image: isoloom/secdevlabs-tictactoe-web
        imagePullPolicy: IfNotPresent
        ports:
